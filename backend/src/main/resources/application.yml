spring:
  application:
    name: assetflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/assetflow}
    username: ${DB_USERNAME:assetflow}
    password: ${DB_PASSWORD:local_only_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  address: 127.0.0.1
  port: 8080
assetflow:
  auth:
    jwt-secret: ${JWT_SECRET}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
